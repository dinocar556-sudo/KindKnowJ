<title>친절한 재혁쌤 AI 튜터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F7F4; --surface:#FFFFFF; --surface-2:#EFF3EE; --surface-3:#E3EAE2;
  --ink:#1B2A27; --ink-2:#52635E; --ink-3:#7E918B;
  --line:#E3E9E2; --line-2:#C9D4C7;
  --primary:#0FA68C; --primary-ink:#0A7A66; --primary-soft:#DCF2EC;
  --grape:#6B5CE7; --grape-soft:#E8E5FB;
  --tangerine:#DE7526; --tangerine-soft:#FBE7D6;
  --sun:#C99106; --sun-soft:#FAEFD2;
  --rose:#DD5A52; --rose-soft:#FBE3E1;
  --on-accent:#FFFFFF;
  --shadow-s:0 1px 2px rgba(27,42,39,.05), 0 4px 12px -6px rgba(27,42,39,.12);
  --shadow:0 2px 4px rgba(27,42,39,.05), 0 14px 32px -18px rgba(27,42,39,.28);
  --r-xl:24px; --r-lg:20px; --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A18; --surface:#1A2421; --surface-2:#212D29; --surface-3:#2A3733;
    --ink:#ECF2EF; --ink-2:#A9BAB4; --ink-3:#7D8F89;
    --line:#2B3733; --line-2:#3C4A45;
    --primary:#3ECFB0; --primary-ink:#82E5CE; --primary-soft:#10332C;
    --grape:#9E92F5; --grape-soft:#241F4D;
    --tangerine:#F09A55; --tangerine-soft:#3A2411;
    --sun:#EDBF4A; --sun-soft:#362A0E;
    --rose:#F0837B; --rose-soft:#3B1F1D;
    --on-accent:#0E1614;
    --shadow-s:0 1px 2px rgba(0,0,0,.35), 0 4px 12px -6px rgba(0,0,0,.5);
    --shadow:0 2px 4px rgba(0,0,0,.35), 0 16px 34px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#121A18; --surface:#1A2421; --surface-2:#212D29; --surface-3:#2A3733;
  --ink:#ECF2EF; --ink-2:#A9BAB4; --ink-3:#7D8F89;
  --line:#2B3733; --line-2:#3C4A45;
  --primary:#3ECFB0; --primary-ink:#82E5CE; --primary-soft:#10332C;
  --grape:#9E92F5; --grape-soft:#241F4D;
  --tangerine:#F09A55; --tangerine-soft:#3A2411;
  --sun:#EDBF4A; --sun-soft:#362A0E;
  --rose:#F0837B; --rose-soft:#3B1F1D;
  --on-accent:#0E1614;
  --shadow-s:0 1px 2px rgba(0,0,0,.35), 0 4px 12px -6px rgba(0,0,0,.5);
  --shadow:0 2px 4px rgba(0,0,0,.35), 0 16px 34px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:16px; line-height:1.72; margin:0;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Do Hyeon","Noto Sans KR",sans-serif; font-weight:400; text-wrap:balance; margin:0; letter-spacing:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
button{font-family:inherit; font-size:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--primary); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
.wrap{max-width:860px; margin:0 auto; padding:0 20px 80px}

/* ── 상단 바 ─────────────────────────── */
.topbar{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line)}
.topbar-in{max-width:860px; margin:0 auto; padding:13px 20px; display:flex; align-items:center; gap:14px}
.brand{display:flex; align-items:center; gap:9px; cursor:pointer; background:none; border:0; padding:0; color:inherit}
.brand .mk{
  width:30px; height:30px; border-radius:11px; background:var(--primary); color:var(--on-accent);
  display:grid; place-items:center; flex:none; box-shadow:var(--shadow-s);
}
.brand .mk svg{width:18px; height:18px}
.brand b{font-family:"Do Hyeon",sans-serif; font-weight:400; font-size:18px; letter-spacing:0}
.brand span{font-size:12px; color:var(--ink-3)}
.topbar .spacer{flex:1}
.pill{font-size:12.5px; padding:5px 13px; border-radius:999px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap}

.dots{display:flex; gap:6px; align-items:center}
.dots i{width:9px; height:9px; border-radius:50%; background:var(--surface-3); transition:transform .2s, background .2s}
.dots i.now{background:transparent; box-shadow:inset 0 0 0 2.5px var(--primary); transform:scale(1.35)}
.dots i.ok{background:var(--primary)}
.dots i.part{background:var(--sun)}
.dots i.bad{background:var(--rose)}
@media (max-width:620px){ .brand span{display:none} .dots i{width:7px; height:7px; gap:4px} }

/* ── 홈 ──────────────────────────────── */
.hero{padding:44px 0 30px}
.hi{
  display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:500;
  color:var(--primary-ink); background:var(--primary-soft); padding:7px 15px; border-radius:999px; margin-bottom:16px;
}
.hero h1{font-size:clamp(30px,5.4vw,42px); line-height:1.32}
.hero p{color:var(--ink-2); max-width:54ch; margin:14px 0 0; font-size:16.5px}
.statrow{display:flex; gap:10px; margin-top:26px; flex-wrap:wrap}
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 18px; min-width:108px; box-shadow:var(--shadow-s);
}
.stat b{display:block; font-family:"Do Hyeon",sans-serif; font-size:25px; line-height:1.1; color:var(--primary-ink)}
.stat span{font-size:12px; color:var(--ink-3)}

.sec-h{display:flex; align-items:baseline; gap:11px; margin:40px 0 16px; flex-wrap:wrap}
.sec-h h2{font-size:22px}
.sec-h em{font-style:normal; font-size:13px; color:var(--ink-3)}

.units{display:grid; grid-template-columns:repeat(auto-fill,minmax(262px,1fr)); gap:13px}
.unit{
  --c:var(--primary); --cs:var(--primary-soft);
  text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-lg);
  padding:19px 20px 17px; display:flex; flex-direction:column; gap:11px; color:inherit;
  box-shadow:var(--shadow-s); transition:border-color .18s, transform .18s, box-shadow .18s;
}
.unit:hover{border-color:var(--c); transform:translateY(-3px); box-shadow:var(--shadow)}
.unit .top{display:flex; align-items:center; gap:11px}
.unit .ico{
  width:44px; height:44px; border-radius:14px; background:var(--cs); color:var(--c);
  display:grid; place-items:center; flex:none;
}
.unit .ico svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.unit .no{font-size:12.5px; font-weight:700; color:var(--c); background:var(--cs); padding:4px 11px; border-radius:999px}
.unit h3{font-size:19px; line-height:1.38; margin-top:-2px}
.unit .kw{font-size:13px; color:var(--ink-3); line-height:1.62; flex:1}
.unit .foot{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-3); flex-wrap:wrap; margin-top:2px}
.score-chip{font-size:12px; font-weight:700; padding:3px 11px; border-radius:999px; background:var(--cs); color:var(--c)}
.unit.all{border-style:dashed}

/* ── 문제 ────────────────────────────── */
.qmeta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:30px 0 15px}
.tag{font-size:12px; font-weight:500; padding:4px 12px; border-radius:999px; background:var(--surface-2); color:var(--ink-2)}
.tag.t-mc,.tag.t-ox{background:var(--primary-soft); color:var(--primary-ink)}
.tag.t-multi{background:var(--grape-soft); color:var(--grape)}
.tag.t-short,.tag.t-calc{background:var(--tangerine-soft); color:var(--tangerine)}
.tag.t-essay{background:var(--sun-soft); color:var(--sun)}
.qnum{font-size:13px; color:var(--ink-3); margin-left:auto; font-weight:500}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-xl); padding:26px 26px 24px; box-shadow:var(--shadow)}
.qtext{font-size:19px; line-height:1.68; margin:0; font-weight:500}
.stem{margin:18px 0 0; padding:15px 18px; background:var(--surface-2); border-radius:var(--r); font-size:15px; color:var(--ink-2); white-space:pre-line}
.stem b{color:var(--ink); font-weight:600}
.dataline{display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 0}
.dataline span{background:var(--surface-2); border-radius:999px; padding:7px 15px; font-size:14px; font-family:"IBM Plex Mono",monospace}
.dataline span b{color:var(--ink-3); font-weight:400; font-family:"Noto Sans KR",sans-serif; margin-right:7px; font-size:13px}
.qtable{overflow-x:auto; margin-top:18px}
.qtable table{border-collapse:collapse; font-size:14.5px; min-width:260px}
.qtable th{text-align:left; padding:8px 18px 8px 0; border-bottom:2px solid var(--line-2); font-size:12.5px; color:var(--ink-3); font-weight:500}
.qtable td{padding:8px 18px 8px 0; border-bottom:1px solid var(--line)}

.opts{display:flex; flex-direction:column; gap:9px; margin-top:22px}
.opt{
  display:flex; gap:13px; align-items:flex-start; text-align:left; width:100%;
  background:var(--surface); border:2px solid var(--line); border-radius:var(--r); padding:14px 16px;
  color:inherit; line-height:1.6; font-size:16px; transition:border-color .15s, background .15s, transform .15s;
}
.opt:hover:not(:disabled){border-color:var(--line-2); background:var(--surface-2); transform:translateX(3px)}
.opt .mk{
  flex:none; width:27px; height:27px; border-radius:50%; border:2px solid var(--line-2);
  display:grid; place-items:center; font-size:13px; font-weight:700; color:var(--ink-3); margin-top:1px;
}
.opt[aria-pressed="true"]{border-color:var(--primary); background:var(--primary-soft)}
.opt[aria-pressed="true"] .mk{background:var(--primary); border-color:var(--primary); color:var(--on-accent)}
.opt.is-ok{border-color:var(--primary); background:var(--primary-soft)}
.opt.is-ok .mk{background:var(--primary); border-color:var(--primary); color:var(--on-accent)}
.opt.is-bad{border-color:var(--rose); background:var(--rose-soft)}
.opt.is-bad .mk{background:var(--rose); border-color:var(--rose); color:var(--on-accent)}
.opt:disabled{cursor:default; opacity:1; transform:none}
.opt .oz{font-size:13.5px; color:var(--ink-2); display:block; margin-top:8px; padding-top:8px; border-top:1.5px dashed var(--line-2)}

.oxrow{display:flex; gap:11px; margin-top:22px}
.oxrow .opt{flex:1; flex-direction:column; justify-content:center; align-items:center; gap:8px; font-size:17px; font-weight:500; padding:20px}
.oxrow .opt .mk{width:38px; height:38px; font-size:19px; margin:0}

.answer-in{
  width:100%; margin-top:20px; padding:15px 17px; border:2px solid var(--line-2); border-radius:var(--r);
  background:var(--surface); color:var(--ink); font-family:inherit; font-size:16.5px; line-height:1.7;
}
.answer-in.mono{font-family:"IBM Plex Mono",monospace}
.answer-in:focus{border-color:var(--primary); outline:none}
.answer-in::placeholder{color:var(--ink-3)}
textarea.answer-in{min-height:140px; resize:vertical}
.unit-hint{margin-top:9px; font-size:13px; color:var(--ink-3)}
.wordcount{float:right}

.actions{display:flex; gap:10px; align-items:center; margin-top:22px; flex-wrap:wrap}
.btn{
  border:2px solid var(--primary); background:var(--primary); color:var(--on-accent); padding:12px 26px;
  border-radius:999px; font-weight:700; font-size:16px; transition:filter .15s, transform .15s;
}
.btn:hover:not(:disabled){filter:brightness(1.07); transform:translateY(-1px)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line-2)}
.btn.ghost:hover:not(:disabled){border-color:var(--ink-3); color:var(--ink)}
.btn.sm{padding:8px 17px; font-size:14px}

.hintbox{
  margin-top:16px; padding:14px 17px; border-radius:var(--r); background:var(--sun-soft);
  font-size:15px; color:var(--ink); line-height:1.65;
}
.hintbox b{color:var(--sun)}

/* ── 피드백 ──────────────────────────── */
.fb{margin-top:18px; border-radius:var(--r-xl); border:1px solid var(--line); background:var(--surface); overflow:hidden; box-shadow:var(--shadow)}
.fb-head{display:flex; align-items:center; gap:12px; padding:18px 26px; font-family:"Do Hyeon",sans-serif; font-size:19px}
.fb-head .badge{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-size:17px; font-weight:700; color:var(--on-accent); flex:none}
.fb.ok .fb-head{background:var(--primary-soft); color:var(--primary-ink)} .fb.ok .badge{background:var(--primary)}
.fb.part .fb-head{background:var(--sun-soft); color:var(--sun)} .fb.part .badge{background:var(--sun)}
.fb.bad .fb-head{background:var(--rose-soft); color:var(--rose)} .fb.bad .badge{background:var(--rose)}
.fb-body{padding:20px 26px 24px; display:flex; flex-direction:column; gap:18px}
.fb-sec h4{margin:0 0 7px; font-family:"Noto Sans KR",sans-serif; font-size:13px; font-weight:700; color:var(--ink-3)}
.fb-sec p{margin:0; font-size:15.5px; line-height:1.78; color:var(--ink-2)}
.fb-sec p b, .fb-sec p strong{color:var(--ink); font-weight:700}
.fb-sec.you p{padding:13px 16px; background:var(--surface-2); border-radius:var(--r); color:var(--ink); white-space:pre-wrap}
.fb-sec.model p{padding:14px 17px; background:var(--primary-soft); border-radius:var(--r); color:var(--primary-ink)}

.rubric{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.rubric li{display:flex; gap:10px; align-items:flex-start; font-size:15px; color:var(--ink-3)}
.rubric .rk{flex:none; width:21px; height:21px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--on-accent); margin-top:4px}
.rubric li.y .rk{background:var(--primary)} .rubric li.n .rk{background:var(--surface-3); color:var(--ink-3)}
.rubric li.y{color:var(--ink)}

.ai-block{border:1.5px dashed var(--line-2); border-radius:var(--r); padding:16px 18px; background:var(--surface-2)}
.ai-block .ai-h{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--primary-ink); margin-bottom:8px}
.ai-block .ai-h .dot{width:7px; height:7px; border-radius:50%; background:var(--primary); animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.ai-block p{margin:0 0 9px; font-size:15.5px; line-height:1.78; color:var(--ink-2)}
.ai-block p:last-child{margin-bottom:0}
.ai-block .lab{font-weight:700; color:var(--ink)}

.askbox{display:flex; gap:9px}
.askbox input{
  flex:1; padding:12px 16px; border:1.5px solid var(--line-2); border-radius:999px;
  background:var(--surface); color:var(--ink); font-family:inherit; font-size:15px;
}
.askbox input:focus{border-color:var(--primary); outline:none}

/* ── 결과 ────────────────────────────── */
.scorehead{text-align:center; padding:44px 0 30px}
.scorebubble{
  width:132px; height:132px; margin:0 auto; border-radius:50%; background:var(--primary-soft);
  display:grid; place-items:center; border:3px solid var(--primary);
}
.scorebubble b{font-family:"Do Hyeon",sans-serif; font-size:52px; line-height:1; color:var(--primary-ink)}
.scorebubble small{display:block; font-size:15px; color:var(--primary-ink); opacity:.75; margin-top:2px}
.scorehead h1{font-size:26px; margin-top:20px}
.scorehead p{color:var(--ink-2); margin:10px auto 0; max-width:46ch; font-size:16px}

.bars{display:flex; flex-direction:column; gap:14px}
.barrow{display:grid; grid-template-columns:1fr 130px 48px; align-items:center; gap:13px; font-size:15px}
.barrow .track{height:11px; border-radius:999px; background:var(--surface-3); overflow:hidden}
.barrow .track i{display:block; height:100%; border-radius:999px; background:var(--primary)}
.barrow.low .track i{background:var(--rose)}
.barrow.mid .track i{background:var(--sun)}
.barrow .pct{font-size:14px; color:var(--ink-3); text-align:right; font-weight:500}

.review{display:flex; flex-direction:column; gap:11px}
.rv{border:1px solid var(--line); border-radius:var(--r-lg); background:var(--surface); overflow:hidden; box-shadow:var(--shadow-s)}
.rv-h{display:flex; gap:12px; align-items:flex-start; padding:15px 18px; width:100%; background:none; border:0; color:inherit; text-align:left; font-size:15.5px; line-height:1.55}
.rv-h .m{flex:none; width:23px; height:23px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700; color:var(--on-accent); margin-top:2px}
.rv.y .m{background:var(--primary)} .rv.p .m{background:var(--sun)} .rv.n .m{background:var(--rose)}
.rv-h .ar{margin-left:auto; color:var(--ink-3); font-size:13px; flex:none}
.rv-b{padding:0 18px 18px 53px; display:flex; flex-direction:column; gap:14px}
.rv-b .lbl{font-size:12.5px; color:var(--ink-3); font-weight:700; display:block; margin-bottom:5px}
.rv-b .txt{font-size:15px; color:var(--ink-2); line-height:1.75}
.rv-b .mine{padding:11px 14px; background:var(--surface-2); border-radius:var(--r-sm); color:var(--ink); white-space:pre-wrap}

.nextup{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-lg); padding:22px 24px; box-shadow:var(--shadow-s)}
.nextup h3{font-size:19px; margin-bottom:12px}
.nextup ul{margin:0; padding-left:20px; color:var(--ink-2); font-size:15.5px; line-height:1.85}
.nextup li b{color:var(--ink)}

.savecard{
  display:flex; gap:22px; align-items:center; flex-wrap:wrap; margin-top:34px;
  background:var(--primary-soft); border-radius:var(--r-xl); padding:24px 26px;
}
.savetext{flex:1; min-width:250px}
.savetext h3{font-size:19px; color:var(--primary-ink)}
.savetext p{margin:6px 0 0; font-size:14.5px; color:var(--ink-2); line-height:1.65}
.saveform{display:flex; gap:10px; align-items:center}
.saveform input{width:150px; margin:0; font-size:15px; padding:11px 16px; border-radius:999px}

.notebook{display:flex; align-items:center; gap:18px; flex-wrap:wrap; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-lg); padding:20px 22px; box-shadow:var(--shadow-s)}
.notebook .nt{flex:1; min-width:230px}
.notebook .nt b{display:block; font-size:16px; font-weight:700}
.notebook .nt span{font-size:14px; color:var(--ink-3)}

.footnote{margin-top:48px; padding-top:20px; border-top:1px solid var(--line); font-size:13px; color:var(--ink-3); line-height:1.75}
[hidden]{display:none!important}
.center{display:flex; justify-content:center; gap:11px; margin-top:30px; flex-wrap:wrap}
</style>

<header class="topbar">
  <div class="topbar-in">
    <button class="brand" id="brand">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 14h6l-2 8 8-12h-6l2-8z"/></svg></span>
      <b>친절한 재혁쌤 AI 튜터</b><span>중등 과학 3 · Ⅵ단원</span>
    </button>
    <div class="spacer"></div>
    <div class="dots" id="dots" hidden></div>
    <div class="pill" id="pcount" hidden>0 / 10</div>
  </div>
</header>

<main class="wrap" id="view-home"></main>
<main class="wrap" id="view-quiz" hidden></main>
<main class="wrap" id="view-report" hidden></main>

<script>
/* ═══════════ 문제은행 ═══════════
   출처: 비상교육 중등 과학3 Ⅵ. 에너지 전환과 보존 (교과서 + 수준별 1000제)
   type: mc(오지선다) multi(합답형) ox(참거짓) short(단답) calc(계산) essay(서술형)
   중력가속도 상수 9.8 사용. Ep = 9.8mh, Ek = ½mv²
*/
const ICON = {

 choices:["A와 B의 위치 에너지는 같다.","B의 위치 에너지가 A의 2배이다.","A의 운동 에너지가 B보다 크다.","B의 역학적 에너지는 0이다.","A의 위치 에너지가 B의 2배이다."],
 answer:1,
 why:["위치 에너지 9.8mh는 높이 h에 비례합니다. 높이가 다르면 위치 에너지도 다릅니다.",
      "맞아요. 질량이 같고 높이가 2배이므로 9.8mh 값도 정확히 2배입니다.",
      "둘 다 정지해 있으므로 운동 에너지는 모두 0입니다.",
      "B는 높이 10 m에 있으므로 위치 에너지가 있고, 따라서 역학적 에너지도 0이 아닙니다.",
      "높이가 더 높은 쪽은 B입니다. 크기 관계가 반대예요."],
 hint:"위치 에너지 = 9.8 × 질량 × 높이. 질량이 같다면 무엇에만 비례할까요?",
 explain:"<b>위치 에너지 = 9.8mh</b>이므로 질량이 같으면 높이에 정비례합니다. 정지해 있으면 운동 에너지는 0이고, 이때 역학적 에너지 = 위치 에너지입니다."},

{id:"u1-12", u:"u1", type:"short", concept:"최고점에서의 에너지",

 answers:["운동에너지","운동"],
 traps:[{re:"위치", msg:"위치 에너지는 최고점에서 오히려 <b>최대</b>가 됩니다. 높이가 가장 높으니까요."},
        {re:"역학", msg:"역학적 에너지는 보존되므로 0이 되지 않습니다. 최고점에서는 전부 위치 에너지 형태로 남아 있습니다."}],
 hint:"최고점에서 물체의 속력은 얼마인가요?",
 explain:"최고점에서는 속력이 0이므로 <b>운동 에너지 = ½mv² = 0</b>입니다. 대신 위치 에너지가 최대가 되어, 역학적 에너지는 위치 에너지와 같은 값이 됩니다."},

{id:"u1-13", u:"u1", type:"mc", concept:"다중 섬광 사진 해석",

 choices:["위로 갈수록 속력이 빨라지고 있다.","위로 갈수록 운동 에너지가 커지고 있다.","위로 갈수록 위치 에너지가 커지고 있다.","위로 갈수록 역학적 에너지가 작아지고 있다.","공에 작용하는 중력의 방향이 위쪽이다."],
 answer:2,

      "속력이 느려지고 있으므로 운동 에너지는 작아집니다.",
      "맞아요. 위로 올라갈수록 높이가 높아지므로 9.8mh 값이 커집니다. 줄어든 운동 에너지가 위치 에너지로 전환된 것입니다.",
      "공기 저항이 없다면 역학적 에너지는 일정하게 보존됩니다.",
      "중력은 언제나 지구 중심 쪽, 즉 아래쪽으로 작용합니다. 그래서 올라가는 공이 느려지는 것입니다."],
 hint:"같은 시간 간격인데 간격이 좁아졌다면 속력은 어떻게 변한 걸까요?",
 explain:"간격이 좁아짐 = 속력 감소 = 운동 에너지 감소. 그리고 높이는 계속 높아지므로 위치 에너지 증가. 이것이 바로 <b>운동 에너지 → 위치 에너지</b> 전환의 사진 증거입니다."},

 rubric:[{label:"올라갈 때: 운동 에너지 → 위치 에너지 전환을 서술", any:["올라갈","올라 갈","상승","위로"]},
         {label:"내려올 때: 위치 에너지 → 운동 에너지 전환을 서술", any:["내려올","내려 올","하강","떨어질"]},
         {label:"'위치 에너지'와 '운동 에너지' 용어를 모두 사용", any:["위치 에너지","위치에너지"], also:["운동 에너지","운동에너지"]},
         {label:"높이 또는 속력의 변화를 근거로 제시", any:["높이","속력","빨라","느려"]}],

 explain:"두 방향을 모두 쓰고, 각각 '높이 변화'와 '속력 변화'를 근거로 들면 완전한 답이 됩니다."},

 rubric:[{label:"내려올 때 위치 에너지 → 운동 에너지 전환을 서술", any:["위치 에너지가 운동","위치에너지가 운동","내려올","내려갈"]},
         {label:"올라갈 때 운동 에너지 → 위치 에너지 전환을 서술", any:["운동 에너지가 위치","운동에너지가 위치","올라갈","올라 갈"]},

 model:"마찰이 없으면 역학적 에너지가 보존된다. 공이 내려올 때 위치 에너지가 모두 운동 에너지로 전환되고, 반대편 빗면을 올라갈 때 그 운동 에너지가 다시 위치 에너지로 전환된다. 역학적 에너지가 일정하므로 처음과 같은 위치 에너지가 될 때까지, 즉 처음과 같은 높이까지 올라간다.",

         {label:"위치 에너지와 운동 에너지를 모두 언급", any:["위치 에너지","위치에너지"], also:["운동 에너지","운동에너지"]},

{id:"u2-01", u:"u2", type:"mc", concept:"낙하 중 에너지 값 구하기",
 q:"질량이 2 kg인 물체를 2.5 m 높이에서 가만히 놓아 낙하시켰다. 지면으로부터 0.5 m 높이에서 물체의 위치 에너지, 운동 에너지, 역학적 에너지를 옳게 짝 지은 것은? (공기 저항은 무시하며, 지면이 기준면이다.)",
 data:[["질량","2 kg"],["처음 높이","2.5 m"],["구하는 지점","0.5 m"]],
 choices:["9.8 J / 39.2 J / 49 J","9.8 J / 49 J / 58.8 J","9.8 J / 58.8 J / 49 J","39.2 J / 9.8 J / 49 J","39.2 J / 58.8 J / 49 J"],
 answer:0,
 why:["맞아요. 위치 에너지 = 9.8×2×0.5 = 9.8 J, 전체 역학적 에너지 = 9.8×2×2.5 = 49 J, 따라서 운동 에너지 = 49 − 9.8 = 39.2 J입니다.",
      "역학적 에너지는 처음 높이에서의 위치 에너지인 49 J로 고정입니다. 58.8 J이 될 수 없어요.",
      "위치 에너지 + 운동 에너지 = 역학적 에너지여야 하는데 9.8 + 58.8 = 68.6이라 앞뒤가 맞지 않습니다.",
      "0.5 m에서의 위치 에너지는 9.8×2×0.5 = 9.8 J입니다. 39.2 J은 운동 에너지 값이에요. 두 값이 서로 바뀌었습니다.",
      "39.2 + 58.8 = 98이므로 역학적 에너지 49 J과 맞지 않습니다."],
 hint:"먼저 처음 높이에서의 위치 에너지(= 역학적 에너지)를 구하고, 그다음 0.5 m에서의 위치 에너지를 빼 보세요.",
 explain:"자유 낙하에서는 <b>역학적 에너지 = 처음 높이의 위치 에너지</b>로 일정합니다. 어느 지점에서든 운동 에너지 = 역학적 에너지 − 그 지점의 위치 에너지로 구하면 됩니다."},

{id:"u2-02", u:"u2", type:"calc", concept:"바닥 도달 순간의 운동 에너지",
 q:"질량이 10 kg인 물체가 1 m 높이에서 자유 낙하 하였다. 물체가 바닥에 도달하는 순간의 운동 에너지는 몇 J인가? (공기 저항은 무시한다.)",
 value:98, unit:"J", tol:0.02,
 traps:[{v:100, msg:"중력가속도를 10으로 계산했군요. 교과서에서는 <b>9.8</b>을 사용합니다. 9.8×10×1 = 98 J이에요."},
        {v:9.8, msg:"질량 10 kg을 빠뜨렸어요. 위치 에너지는 9.8 × <b>질량</b> × 높이입니다."},
        {v:49, msg:"½을 곱한 것 같아요. 위치 에너지에는 ½이 붙지 않습니다. ½은 운동 에너지 ½mv²에만 붙어요."}],
 hint:"바닥에 닿는 순간에는 위치 에너지가 모두 운동 에너지로 바뀌어 있습니다. 처음 위치 에너지만 구하면 끝나요.",
 solution:"처음 위치 에너지 = 9.8 × 10 × 1 = 98 J → 바닥에서는 위치 에너지가 0이므로 운동 에너지 = 98 J",
 explain:"역학적 에너지 보존에 의해 <b>바닥에서의 운동 에너지 = 처음 높이에서의 위치 에너지</b>입니다. 복잡하게 속력을 먼저 구할 필요가 없습니다."},

{id:"u2-03", u:"u2", type:"calc", concept:"낙하 속력 구하기",
 q:"4.9 m 높이에서 질량이 1 kg인 물체가 자유 낙하 할 때, 바닥에 도달하는 순간의 속력은 몇 m/s인가? (공기 저항은 무시한다.)",
 value:9.8, unit:"m/s", tol:0.02,
 traps:[{v:4.9, msg:"높이 값을 그대로 답으로 쓴 것 같아요. 속력은 운동 에너지 식 ½mv²에서 v를 구해야 합니다."},
        {v:96.04, msg:"거의 다 왔어요! 96.04는 <b>v²</b> 값입니다. 마지막에 제곱근을 씌우면 v = 9.8 m/s입니다."},
        {v:48.02, msg:"운동 에너지 값(48.02 J)을 답으로 썼네요. 여기서 ½mv² = 48.02를 풀어 v를 구해야 합니다."}],
 hint:"9.8mh = ½mv² 로 놓으면 질량 m이 양쪽에서 지워집니다.",
 solution:"9.8 × 1 × 4.9 = ½ × 1 × v² → 48.02 = 0.5v² → v² = 96.04 → v = 9.8 m/s",
 explain:"<b>9.8mh = ½mv²</b>에서 질량이 약분되므로, 낙하 속력은 <b>질량과 무관하고 높이로만 결정</b>됩니다. 무거운 공과 가벼운 공이 같은 높이에서 떨어지면 같은 속력으로 도착하는 이유입니다."},

{id:"u2-04", u:"u2", type:"mc", concept:"에너지의 비 구하기",
 q:"질량이 1 kg인 물체를 지면으로부터 10 m 높이에서 가만히 놓았다. 물체가 높이 2 m 지점을 지날 때 운동 에너지와 위치 에너지의 비(운동 : 위치)는? (공기 저항은 무시한다.)",
 choices:["1 : 4","4 : 1","1 : 5","5 : 1","1 : 1"],
 answer:1,

      "맞아요. 낙하한 거리 8 m가 운동 에너지로, 남은 높이 2 m가 위치 에너지로 대응하므로 8 : 2 = 4 : 1입니다.",
      "전체 높이 10 m와 남은 높이 2 m를 비교한 것 같아요. 운동 에너지는 <b>낙하한 거리</b>(8 m)에 대응합니다.",
      "5 : 1은 10 : 2의 비입니다. 하지만 운동 에너지는 전체 높이가 아니라 낙하한 거리에 비례합니다.",
      "1 : 1이 되려면 정확히 절반 높이인 5 m 지점이어야 합니다."],

{id:"u2-05", u:"u2", type:"calc", concept:"낙하 도중의 운동 에너지",
 q:"지면으로부터 20 m 높이에서 질량이 5 kg인 공을 가만히 놓아 떨어뜨렸다. 공이 15 m 지점을 지날 때 공의 운동 에너지는 몇 J인가? (공기 저항은 무시한다.)",
 value:245, unit:"J", tol:0.02,
 traps:[{v:980, msg:"전체 높이 20 m를 넣었네요. 운동 에너지는 <b>낙하한 거리</b>(20 − 15 = 5 m)에 해당합니다."},
        {v:735, msg:"735 J은 15 m 지점에서의 <b>위치 에너지</b>입니다. 문제가 묻는 것은 운동 에너지예요."},
        {v:49, msg:"질량 5 kg을 빠뜨린 것 같아요. 9.8 × 5 × 5 = 245 J입니다."}],
 hint:"공이 실제로 몇 m를 떨어졌는지부터 계산하세요.",
 solution:"낙하한 거리 = 20 − 15 = 5 m → 감소한 위치 에너지 = 9.8 × 5 × 5 = 245 J = 증가한 운동 에너지",
 explain:"처음에 정지해 있었으므로 <b>운동 에너지 = 감소한 위치 에너지 = 9.8 × m × (낙하한 거리)</b>입니다. '전체 높이'가 아니라 '떨어진 거리'라는 점이 핵심입니다."},

{id:"u2-06", u:"u2", type:"mc", concept:"절반 높이에서의 에너지",
 q:"10 m 높이에서 질량이 2 kg인 물체를 가만히 놓았다. 높이 5 m인 지점을 지나는 순간 물체의 위치 에너지, 운동 에너지, 역학적 에너지를 옳게 짝 지은 것은? (공기 저항은 무시한다.)",
 choices:["98 J / 98 J / 196 J","98 J / 196 J / 98 J","196 J / 98 J / 98 J","196 J / 98 J / 196 J","196 J / 196 J / 196 J"],
 answer:0,

      "위치 에너지 + 운동 에너지 = 역학적 에너지여야 하는데 98 + 196 = 294가 되어 맞지 않습니다.",

      "196 + 98 = 294이므로 역학적 에너지 196 J과 맞지 않습니다.",

 hint:"세 값 중 두 개를 더하면 나머지 하나가 되어야 합니다. 그 조건만으로도 선택지를 크게 줄일 수 있어요.",
 explain:"정확히 절반 높이에서는 <b>위치 에너지 = 운동 에너지 = 역학적 에너지의 절반</b>이 됩니다. 자주 나오는 특수한 지점이니 기억해 두세요."},

{id:"u2-07", u:"u2", type:"calc", concept:"위로 던진 물체의 운동 에너지",
 q:"질량이 200 g인 공을 14 m/s의 속력으로 연직 위로 던져 올렸다. 높이가 5 m인 곳에서 공의 운동 에너지는 몇 J인가? (공기 저항은 무시한다.)",
 value:9.8, unit:"J", tol:0.02,
 traps:[{v:19.6, msg:"19.6 J은 던지는 순간의 <b>처음 운동 에너지</b>입니다. 5 m 올라가면서 위치 에너지로 전환된 9.8 J을 빼야 해요."},
        {v:1960, msg:"질량 단위를 놓쳤어요. 200 g = <b>0.2 kg</b>으로 바꿔서 계산해야 합니다."},
        {v:29.4, msg:"빼야 할 것을 더했네요. 올라가는 동안 운동 에너지는 <b>줄어듭니다</b>."}],
 hint:"200 g을 kg으로 먼저 바꾸세요. 그다음 처음 운동 에너지에서 5 m만큼의 위치 에너지를 빼면 됩니다.",
 solution:"처음 운동 에너지 = ½ × 0.2 × 14² = 19.6 J, 5 m에서의 위치 에너지 = 9.8 × 0.2 × 5 = 9.8 J → 운동 에너지 = 19.6 − 9.8 = 9.8 J",
 explain:"위로 던진 물체는 <b>처음 운동 에너지 = 그 높이의 위치 에너지 + 남은 운동 에너지</b>입니다. 단위 변환(g → kg)을 놓치면 1000배 틀리니 항상 먼저 확인하세요."},

{id:"u2-08", u:"u2", type:"calc", concept:"운동 에너지 변화로 높이차 구하기",

 value:5, unit:"m", tol:0.02,
 traps:[{v:9.08, msg:"267 J 전체를 위치 에너지 감소량으로 본 것 같아요. A점에서 이미 120 J의 운동 에너지가 있었으므로 <b>늘어난 만큼(267 − 120)</b>만 위치 에너지에서 온 것입니다."},
        {v:147, msg:"147은 운동 에너지의 증가량(J)입니다. 여기서 한 단계 더 나아가 9.8 × 3 × h = 147을 풀어야 높이가 나옵니다."},
        {v:13.16, msg:"두 운동 에너지를 더한 것 같아요. 변화량은 <b>뺄셈</b>으로 구합니다."}],
 hint:"늘어난 운동 에너지는 어디서 온 것일까요? 그 값이 곧 줄어든 위치 에너지입니다.",
 solution:"운동 에너지 증가량 = 267 − 120 = 147 J = 위치 에너지 감소량 → 9.8 × 3 × h = 147 → h = 5 m",
 explain:"역학적 에너지 보존의 가장 실용적인 형태는 <b>위치 에너지 감소량 = 운동 에너지 증가량</b>입니다. 두 지점의 값을 알면 높이차나 질량을 거꾸로 구할 수 있습니다."},

{id:"u2-09", u:"u2", type:"mc", concept:"공기 저항이 있을 때",

 choices:["역학적 에너지가 일정하게 보존된다.","역학적 에너지가 점점 증가한다.","역학적 에너지의 일부가 열에너지 등으로 전환되어 역학적 에너지가 감소한다.","위치 에너지만 감소하고 운동 에너지는 변하지 않는다.","에너지의 총량이 줄어들어 에너지 보존 법칙이 성립하지 않는다."],

      "맞아요. 공기와 부딪히며 일부 에너지가 열에너지와 소리 에너지로 빠져나가므로, 위치 에너지 + 운동 에너지의 값은 점점 줄어듭니다.",

{id:"u2-10", u:"u2", type:"short", concept:"보존의 핵심 관계",

        {re:"감소량.*운동|운동.*감소", msg:"자유 낙하에서 운동 에너지는 <b>증가</b>합니다. 감소하는 것은 위치 에너지예요."}],

{id:"u2-12", u:"u2", type:"ox", concept:"낙하 중 역학적 에너지",

        {v:15, msg:"거의 맞았어요! 중력가속도를 10으로 어림한 것 같습니다. 9.8로 계산하면 15.1 m입니다."},

 hint:"먼저 그 지점의 운동 에너지를 구하고, 그 에너지가 몇 m 떨어지면서 생긴 것인지 계산하세요.",
 solution:"운동 에너지 = ½ × 1 × 9.8² = 48.02 J = 9.8 × 1 × (낙하 거리) → 낙하 거리 = 4.9 m → B의 높이 = 20 − 4.9 = 15.1 m",

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const $ = s => document.querySelector(s);
const H = {home:$("#view-home"), quiz:$("#view-quiz"), report:$("#view-report")};
const KEY = "energy-tutor-v1";
const TYPE_LABEL = {mc:"선택형", multi:"합답형", ox:"참·거짓", short:"단답형", calc:"계산형", essay:"서술형"};
const TYPE_RANK = {mc:0, multi:1, ox:2, short:3, calc:4, essay:5};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── 저장소 ── */
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
function store(){ const d = load(); d.best = d.best||{}; d.wrong = d.wrong||{}; d.runs = d.runs||0; return d; }

/* ── Claude 연결 ── */
let SAMPLE, SAMPLE_TRIED = false;
async function getSample(){
  if(SAMPLE_TRIED) return SAMPLE;
  SAMPLE_TRIED = true;
  try{ SAMPLE = (window.claude && claude.use) ? await claude.use("sample") : null; }
  catch(e){ SAMPLE = null; }
  return SAMPLE;
}

/* ── 유틸 ── */
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function norm(s){ return String(s||"").toLowerCase().replace(/\s+/g,"").replace(/[.,!?'"()\[\]{}·:;~\-–—/\\]/g,"").replace(/에요|예요|입니다|이다|한다|된다|다\.?$/g,""); }
function numOf(s){ const m = String(s||"").replace(/,/g,"").match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; }
function near(a,b,tol){ return Math.abs(a-b) <= Math.max(Math.abs(b)*tol, 1e-9); }

/* ── 문항 선택 ── */
function pickQuestions(uid, n){
  n = n || 10;
  let pool = uid === "all" ? BANK.slice() : (uid === "wrong" ? BANK.filter(q => store().wrong[q.id]) : BANK.filter(q => q.u === uid));
  if(pool.length <= n) return pool.slice().sort((a,b) => TYPE_RANK[a.type]-TYPE_RANK[b.type]);
  const quota = [["mc",3],["multi",1],["ox",1],["short",2],["calc",1],["essay",2]];
  const picked = [], used = new Set();
  for(const [t,k] of quota){
    for(const q of shuffle(pool.filter(x => x.type === t)).slice(0,k)){ picked.push(q); used.add(q.id); }
  }
  for(const q of shuffle(pool)){ if(picked.length >= n) break; if(!used.has(q.id)){ picked.push(q); used.add(q.id); } }
  return picked.slice(0,n).sort((a,b) => TYPE_RANK[a.type]-TYPE_RANK[b.type]);
}

/* ── 화면 전환 ── */
function show(v){
  for(const k in H){ H[k].hidden = (k !== v); }
  $("#dots").hidden = $("#pcount").hidden = (v !== "quiz");
  window.scrollTo({top:0, behavior:"instant"});
}

function renderDots(){
  $("#dots").innerHTML = S.qs.map((q,i) => {
    const r = S.results[i];
    const cls = r ? r.verdict : (i === S.i ? "now" : "");
    return `<i class="${cls}"></i>`;
  }).join("");
}

/* ═══════════ 홈 ═══════════ */
function renderHome(){
  const d = store();
  const wrongIds = Object.keys(d.wrong);
  const done = Object.keys(d.best).length;
  const avg = done ? Math.round(Object.values(d.best).reduce((a,b)=>a+b,0)/done*10) : 0;
  const hello = d.name ? `${esc(d.name)}, 다시 만나서 반가워요!` : "안녕하세요! 오늘도 같이 해봐요";
  H.home.innerHTML = `
  <section class="hero">
    <div class="hi">${hello}</div>
    <h1>어떤 단원부터 볼까요?</h1>
    <p>단원을 고르면 문제 10개가 새로 만들어져요. 답을 낼 때마다 <b>내가 쓴 답에 딱 맞는 설명</b>이 따라옵니다. 왜 그 선택지가 아닌지, 계산이 어디서 어긋났는지까지 하나씩 짚어 줄게요. 틀려도 괜찮아요.</p>
    <div class="statrow">
      <div class="stat"><b>${BANK.length}</b><span>전체 문제</span></div>
      <div class="stat"><b>${done}<span style="font-size:16px"> / 5</span></b><span>풀어 본 단원</span></div>
      <div class="stat"><b>${avg}<span style="font-size:16px">%</span></b><span>최고 평균</span></div>
      <div class="stat"><b>${wrongIds.length}</b><span>오답 노트</span></div>
    </div>
  </section>

  <div class="sec-h"><h2>단원 고르기</h2><em>한 단원에 10문제 · 풀 때마다 새로 뽑혀요</em></div>
  <div class="units">
    ${UNITS.map(u => {
      const cnt = BANK.filter(q => q.u === u.id).length;
      const best = d.best[u.id];
      return `<button class="unit" data-u="${u.id}" style="--c:var(--${u.c}); --cs:var(--${u.c}-soft)">
        <span class="top"><span class="ico">${svg(u.ic)}</span><span class="no">${u.no}</span></span>
        <h3>${u.title}</h3>
        <span class="kw">${u.kw}</span>
        <span class="foot"><span>문제 ${cnt}개</span>${best!=null?`<span class="score-chip">최고 ${best}점</span>`:""}</span>
      </button>`;
    }).join("")}
    <button class="unit all" data-u="all" style="--c:var(--ink-2); --cs:var(--surface-2)">
      <span class="top"><span class="ico">${svg("mix")}</span><span class="no">종합</span></span>
      <h3>전 단원 섞어 풀기</h3>
      <span class="kw">다섯 단원을 골고루 섞어서 10문제 — 시험 볼 때 딱이에요</span>
      <span class="foot"><span>문제 ${BANK.length}개 중에서</span>${d.best.all!=null?`<span class="score-chip">최고 ${d.best.all}점</span>`:""}</span>
    </button>
  </div>

  ${wrongIds.length >= 3 ? `
  <div class="sec-h"><h2>오답 노트</h2><em>틀렸던 문제만 다시 만나기</em></div>
  <div class="notebook">
    <div class="nt">
      <b>틀린 문제 ${wrongIds.length}개를 모아 뒀어요.</b>
      <span>다시 맞히면 노트에서 스르륵 사라집니다.</span>
    </div>
    <button class="btn" data-u="wrong">오답만 풀어보기</button>
  </div>` : ""}

  <p class="footnote">문제는 비상교육 중등 과학 3 <b>Ⅵ. 에너지 전환과 보존</b> 교과서와 수준별 1000제의 개념·유형을 바탕으로 만들었어요. 중력가속도는 교과서와 같이 9.8을 씁니다. 학습 기록은 이 기기에만 저장돼요.</p>`;

  H.home.querySelectorAll("[data-u]").forEach(b => b.onclick = () => startQuiz(b.dataset.u));
}

/* ═══════════ 퀴즈 ═══════════ */
let S = null;

function startQuiz(uid){
  const qs = pickQuestions(uid);
  if(!qs.length){ alert("풀 수 있는 문항이 없습니다."); return; }
  S = {uid, qs, i:0, results:[], sel:null, multi:new Set(), revealed:false};
  show("quiz");
  renderQ();
}

function unitName(uid){
  if(uid === "all") return "전 단원 종합";
  if(uid === "wrong") return "오답 노트";
  const u = UNITS.find(x => x.id === uid);
  return u ? u.no + " " + u.title : "";
}

function renderQ(){
  const q = S.qs[S.i];
  S.sel = null; S.multi = new Set(); S.revealed = false;
  renderDots();
  $("#pcount").textContent = (S.i+1) + " / " + S.qs.length;

  let body = "";
  if(q.stem) body += `<div class="stem">${q.stem}</div>`;
  if(q.data) body += `<div class="dataline">${q.data.map(([k,v]) => `<span><b>${k}</b>${v}</span>`).join("")}</div>`;
  if(q.table) body += `<div class="qtable"><table><thead><tr>${q.table.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${q.table.rows.map(r=>`<tr>${r.map((c,ci)=>`<td class="${ci?"mono":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

  if(q.type === "mc"){
    body += `<div class="opts">${q.choices.map((c,i) => `<button class="opt" data-i="${i}"><span class="mk">${"①②③④⑤"[i]}</span><span>${c}</span></button>`).join("")}</div>`;
  } else if(q.type === "multi"){
    body += `<div class="opts">${q.items.map((c,i) => `<button class="opt" data-i="${i}"><span class="mk">${"ㄱㄴㄷㄹㅁ"[i]}</span><span>${c}</span></button>`).join("")}</div>
      <p class="unit-hint">맞는 것을 <b>모두</b> 골라 주세요. 다시 누르면 선택이 풀려요.</p>`;
  } else if(q.type === "ox"){
    body += `<div class="oxrow">
      <button class="opt" data-i="0"><span class="mk">O</span><span>맞아요</span></button>
      <button class="opt" data-i="1"><span class="mk">X</span><span>아니에요</span></button></div>`;
  } else if(q.type === "calc"){
    body += `<input class="answer-in mono" id="ain" autocomplete="off" placeholder="계산한 값을 써 주세요 (단위: ${q.unit})">
      <p class="unit-hint">단위는 <b>${q.unit}</b>예요. 숫자만 써도 괜찮아요.</p>`;
  } else if(q.type === "short"){
    body += `<input class="answer-in" id="ain" autocomplete="off" placeholder="답을 써 주세요">`;
  } else {
    body += `<textarea class="answer-in" id="ain" placeholder="문장으로 설명해 보세요. 짧아도 괜찮으니 아는 만큼 써 보면 돼요."></textarea>
      <p class="unit-hint">이 문제는 ${q.rubric.length}가지를 담으면 만점이에요.<span class="wordcount" id="wc">0자</span></p>`;
  }

  H.quiz.innerHTML = `
    <div class="qmeta">
      <span class="tag">${unitName(S.uid)}</span>
      <span class="tag t-${q.type}">${TYPE_LABEL[q.type]}</span>
      <span class="tag">${q.concept}</span>
      <span class="qnum">${S.i+1} / ${S.qs.length}</span>
    </div>
    <div class="card">
      <p class="qtext">${q.q}</p>
      ${body}
      <div class="actions">
        <button class="btn" id="submit" disabled>답 확인하기</button>
        ${q.hint ? `<button class="btn ghost sm" id="hintbtn">힌트 주세요</button>` : ""}
        <button class="btn ghost sm" id="skip">모르겠어요</button>
      </div>
      <div id="hintslot"></div>
    </div>
    <div id="fbslot"></div>`;

  H.quiz.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if(q.type === "multi"){
      if(S.multi.has(i)){ S.multi.delete(i); b.setAttribute("aria-pressed","false"); }
      else { S.multi.add(i); b.setAttribute("aria-pressed","true"); }
      $("#submit").disabled = S.multi.size === 0;
    } else {
      S.sel = i;
      H.quiz.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      $("#submit").disabled = false;
    }
  });

  const ain = $("#ain");
  if(ain){
    ain.oninput = () => {
      $("#submit").disabled = !ain.value.trim();
      if($("#wc")) $("#wc").textContent = ain.value.trim().length + "자";
    };
    if(q.type !== "essay") ain.onkeydown = e => { if(e.key === "Enter" && ain.value.trim()) grade(); };
    ain.focus();
  }
  $("#submit").onclick = () => grade(false);
  $("#skip").onclick = () => grade(true);
  if($("#hintbtn")) $("#hintbtn").onclick = e => {
    $("#hintslot").innerHTML = `<div class="hintbox"><b>힌트</b> · ${q.hint}</div>`;
    e.preventDefault();
    e.target.remove();
  };
}

/* ── 채점 ── */
function rubricHits(q, raw){
  if(!raw) return q.rubric.map(() => false);
  const has = k => raw.includes(k) || norm(raw).includes(norm(k));
  return q.rubric.map(r => r.any.some(has) && (!r.also || r.also.some(has)));
}

function grade(skipped){
  const q = S.qs[S.i];
  if(S.revealed) return;
  skipped = (skipped === true);
  const ain = $("#ain");
  const raw = ain ? ain.value.trim() : "";
  const answered = q.type === "multi" ? S.multi.size > 0
                 : (q.type === "mc" || q.type === "ox") ? S.sel !== null
                 : raw !== "";
  if(!skipped && !answered) return;
  S.revealed = true;

  let verdict = "bad", detail = "", mine = "";
  if(q.type === "mc") mine = S.sel != null ? "①②③④⑤"[S.sel] + " " + q.choices[S.sel] : "";
  else if(q.type === "ox") mine = S.sel != null ? (S.sel === 0 ? "옳다 (O)" : "옳지 않다 (X)") : "";
  else if(q.type === "multi") mine = [...S.multi].sort((a,b)=>a-b).map(i => "ㄱㄴㄷㄹㅁ"[i]).join(", ");
  else mine = raw;

  if(q.type === "essay"){
    const hits = rubricHits(q, raw);
    const n = hits.filter(Boolean).length;
    detail = JSON.stringify(hits);
    verdict = !raw ? "bad" : n === q.rubric.length ? "ok" : (n >= Math.ceil(q.rubric.length/2) ? "part" : "bad");
  } else if(!answered){
    detail = "먼저 아래 해설을 읽어 보세요. 다음에 비슷한 문제를 만나면 스스로 풀 수 있습니다.";
  } else if(q.type === "mc" || q.type === "ox"){
    const correct = q.type === "ox" ? (q.answer ? 0 : 1) : q.answer;
    verdict = S.sel === correct ? "ok" : "bad";
    detail = q.why[S.sel];
  } else if(q.type === "multi"){
    const sel = [...S.multi].sort((a,b)=>a-b), ans = q.answer.slice().sort((a,b)=>a-b);
    const hit = sel.filter(i => ans.includes(i)).length;
    const miss = ans.filter(i => !sel.includes(i)).length + sel.filter(i => !ans.includes(i)).length;
    verdict = miss === 0 ? "ok" : (hit > 0 && miss === 1 ? "part" : "bad");
  } else if(q.type === "calc"){
    const v = numOf(raw);
    if(v !== null && near(v, q.value, q.tol)) verdict = "ok";
    else {
      const t = (q.traps||[]).find(t => v !== null && near(v, t.v, 0.005));
      detail = t ? t.msg : (v === null ? "숫자를 찾을 수 없었어요. 계산한 값을 숫자로 적어 주세요." : `계산 결과를 다시 확인해 보세요. 정답은 <b>${q.value} ${q.unit}</b>입니다.`);
    }
  } else { /* short */
    const n = norm(raw);
    const hitAns = (q.answers||[]).some(a => {
      if(a.includes("|")) { let p = 0; return a.split("|").every(tok => { const k = n.indexOf(norm(tok), p); if(k < 0) return false; p = k + 1; return true; }); }
      const na = norm(a);
      return n === na || (na.length >= 2 && n.includes(na));
    });
    verdict = hitAns ? "ok" : "bad";
    if(!hitAns){
      const t = (q.traps||[]).find(t => new RegExp(t.re).test(raw) || new RegExp(t.re).test(n));
      detail = t ? t.msg : "아직 정답이 아닙니다. 아래 해설의 용어를 확인해 보세요.";
    }
  }

  const noAnswer = skipped && !answered;
  S.results.push({q, verdict, mine, skipped:noAnswer, detail,
                  pick: q.type === "multi" ? [...S.multi].sort((a,b)=>a-b) : S.sel,
                  hits: q.type === "essay" ? JSON.parse(detail) : null,
                  ai:null, asks:[]});
  const idx = S.results.length - 1;
  const d = store();
  if(verdict === "ok"){ delete d.wrong[q.id]; } else { d.wrong[q.id] = (d.wrong[q.id]||0) + 1; }
  save(d);

  H.quiz.querySelectorAll(".opt, #submit, #skip, #hintbtn").forEach(b => b.disabled = true);
  if(ain) ain.disabled = true;
  markChoices(q, noAnswer);
  renderDots();
  renderFeedback(q, verdict, detail, mine, noAnswer, idx);
}

function markChoices(q, skipped){
  const opts = [...H.quiz.querySelectorAll(".opt")];
  if(!opts.length) return;
  if(q.type === "mc"){
    opts.forEach((b,i) => { if(i === q.answer) b.classList.add("is-ok"); else if(i === S.sel) b.classList.add("is-bad"); });
  } else if(q.type === "ox"){
    const c = q.answer ? 0 : 1;
    opts.forEach((b,i) => { if(i === c) b.classList.add("is-ok"); else if(i === S.sel) b.classList.add("is-bad"); });
  } else if(q.type === "multi"){
    opts.forEach((b,i) => {
      const isAns = q.answer.includes(i), chosen = S.multi.has(i);
      if(isAns) b.classList.add("is-ok"); else if(chosen) b.classList.add("is-bad");
      const z = document.createElement("span");
      z.className = "oz";
      z.innerHTML = (isAns ? "옳은 설명 · " : "옳지 않은 설명 · ") + q.why[i];
      b.lastElementChild.appendChild(z);
    });
  }
}

/* ── 피드백 패널 ── */
function renderFeedback(q, verdict, detail, mine, skipped, idx){
  const head = {ok:["✓","정답이에요! 잘했어요"], part:["!","거의 다 왔어요"], bad:["?","같이 다시 볼까요?"]}[verdict];
  let inner = "";

  if(q.type === "essay"){
    const hits = JSON.parse(detail || "[]");
    inner += `<div class="fb-sec you"><h4>내가 쓴 답</h4><p>${esc(mine || "(답하지 않음)")}</p></div>`;
    inner += `<div class="fb-sec"><h4>담아야 할 내용 ${hits.filter(Boolean).length} / ${q.rubric.length}</h4>
      <ul class="rubric">${q.rubric.map((r,i) => `<li class="${hits[i]?"y":"n"}"><span class="rk">${hits[i]?"✓":"·"}</span><span>${r.label}</span></li>`).join("")}</ul></div>`;
    inner += `<div class="fb-sec" id="aislot"></div>`;
    inner += `<div class="fb-sec model"><h4>모범 답안</h4><p>${q.model}</p></div>`;
  } else {
    if(mine) inner += `<div class="fb-sec you"><h4>내가 쓴 답</h4><p>${esc(mine)}</p></div>`;
    if(q.type === "multi"){
      const ans = q.answer.map(i => "ㄱㄴㄷㄹㅁ"[i]).join(", ");
      inner += `<div class="fb-sec"><h4>정답</h4><p><b>${ans}</b> — 위의 보기마다 왜 맞는지, 왜 아닌지 적어 두었어요.</p></div>`;
    } else if(detail){
      inner += `<div class="fb-sec"><h4>${verdict === "ok" ? "왜 맞았을까?" : "왜 그럴까?"}</h4><p>${detail}</p></div>`;
    }
    if(q.type === "calc"){
      inner += `<div class="fb-sec"><h4>정답과 풀이</h4><p><b class="mono">${q.value} ${q.unit}</b><br>${q.solution}</p></div>`;
    }
    if(q.type === "short" && verdict !== "ok"){
      inner += `<div class="fb-sec model"><h4>정답</h4><p>${q.answers[0].replace(/\|/g," → ")}</p></div>`;
    }
  }
  inner += `<div class="fb-sec"><h4>한 번 더 정리하면</h4><p>${q.explain}</p></div>`;
  inner += `<div class="fb-sec" id="askslot"></div>`;

  const last = S.i === S.qs.length - 1;
  $("#fbslot").innerHTML = `
    <div class="fb ${verdict}">
      <div class="fb-head"><span class="badge">${head[0]}</span>${skipped ? "설명을 같이 읽어 봐요" : head[1]}</div>
      <div class="fb-body">${inner}</div>
    </div>
    <div class="center"><button class="btn" id="next">${last ? "결과 보러 가기" : "다음 문제 →"}</button></div>`;

  $("#next").onclick = () => {
    if(last){ finish(); } else { S.i++; renderQ(); }
  };
  $("#next").focus();

  if(q.type === "essay") aiFeedback(q, mine, JSON.parse(detail || "[]"), idx);
  mountAskBox(q, mine, idx);
  $("#fbslot").scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* ── AI 서술형 피드백 ── */
async function aiFeedback(q, mine, hits, idx){
  const slot = $("#aislot");
  if(!slot || !mine || !mine.trim()) return;
  const s = await getSample();
  if(!s || !slot.isConnected) return;
  slot.innerHTML = `<div class="ai-block"><div class="ai-h"><span class="dot"></span>AI 선생님이 답안을 읽고 있습니다…</div><p>잠시만 기다려 주세요.</p></div>`;
  const missing = q.rubric.filter((r,i) => !hits[i]).map(r => r.label);
  const prompt = `당신은 중학교 3학년 과학 담당 선생님입니다. 학생의 서술형 답안을 읽고 개별 피드백을 씁니다.

[문제] ${q.q}
[모범 답안] ${q.model}
[채점 기준] ${q.rubric.map((r,i) => (i+1) + ") " + r.label).join(" / ")}
[자동 채점 결과] ${q.rubric.length}개 중 ${hits.filter(Boolean).length}개 충족${missing.length ? " · 빠진 기준: " + missing.join(", ") : " · 모두 충족"}
[학생 답안] ${mine}

작성 규칙
- good: 학생이 실제로 쓴 표현을 인용하며 잘한 점을 구체적으로 칭찬한다. 답안이 짧거나 부족해도 시도한 부분을 찾아 인정한다.
- improve: 빠진 채점 기준을 학생의 문장과 연결해 무엇을 덧붙여야 하는지 알려 준다. 모두 충족했다면 표현을 더 정확하게 다듬을 방법을 제안한다.
- next: 이 개념을 한 단계 더 생각해 보게 하는 짧은 질문 하나.
- 모범 답안을 그대로 옮겨 적지 않는다. 중학생이 이해할 쉬운 말과 존댓말을 쓰고, 각 항목은 2문장 이내로 쓴다.

JSON으로만 답하세요: {"good":"...","improve":"...","next":"..."}`;
  try{
    const r = await s.json(prompt, {modelTier:"default"});
    if(S.results[idx]) S.results[idx].ai = {good:r.good||"", improve:r.improve||"", next:r.next||""};
    if(!slot.isConnected) return;
    slot.innerHTML = `<div class="ai-block">
      <div class="ai-h">AI 선생님의 피드백</div>
      <p><span class="lab">잘한 점 ·</span> ${esc(r.good||"")}</p>
      <p><span class="lab">보완할 점 ·</span> ${esc(r.improve||"")}</p>
      <p><span class="lab">한 걸음 더 ·</span> ${esc(r.next||"")}</p></div>`;
  }catch(e){
    if(slot.isConnected) slot.innerHTML = "";
  }
}

/* ── AI 질문 상자 ── */
async function mountAskBox(q, mine, idx){
  const slot = $("#askslot");
  const s = await getSample();
  if(!s || !slot || !slot.isConnected) return;
  slot.innerHTML = `<h4>더 궁금한 게 있나요?</h4>
    <div class="askbox"><input id="askin" placeholder="편하게 물어보세요. 예) 왜 최고점에서 0이 되나요?"><button class="btn sm" id="askbtn">물어보기</button></div>
    <div id="asklog"></div><div id="askout"></div>`;
  const run = async () => {
    const t = $("#askin").value.trim();
    if(!t) return;
    $("#askbtn").disabled = true; $("#askin").disabled = true;
    $("#askout").innerHTML = `<div class="ai-block" style="margin-top:10px"><div class="ai-h"><span class="dot"></span>답변을 준비하고 있습니다…</div></div>`;
    const prompt = `당신은 중학교 3학년 과학 선생님입니다. 학생이 방금 푼 문제에 대해 질문했습니다.

[문제] ${q.q}
[이 문제의 핵심 개념] ${q.concept}
[해설] ${q.explain.replace(/<[^>]+>/g,"")}
[학생이 쓴 답] ${mine || "(없음)"}
[학생의 질문] ${t}

중학생이 이해할 수 있는 쉬운 말과 존댓말로, 4문장 이내로 답해 주세요. 필요하면 일상적인 예를 하나 들어 주세요. 학생을 탓하지 말고 격려하는 말투로 씁니다.`;
    try{
      const r = await s(prompt, {modelTier:"default"});
      if(S.results[idx]) S.results[idx].asks.push({q:t, a:r.text});
      $("#askout").innerHTML = "";
      $("#asklog").insertAdjacentHTML("beforeend",
        `<div class="ai-block" style="margin-top:10px"><div class="ai-h">내 질문</div><p>${esc(t)}</p>
         <div class="ai-h" style="margin-top:10px">AI 선생님</div><p>${esc(r.text)}</p></div>`);
      $("#askin").value = "";
    }catch(e){
      $("#askout").innerHTML = `<div class="ai-block" style="margin-top:10px"><p>지금은 답변을 가져올 수 없습니다. 위의 해설을 먼저 읽어 보세요.</p></div>`;
    }
    $("#askbtn").disabled = false; $("#askin").disabled = false; $("#askin").focus();
  };
  $("#askbtn").onclick = run;
  $("#askin").onkeydown = e => { if(e.key === "Enter") run(); };
}

const PW = 794, PH = 1123, PPAD = 44;
const P = {ink:"#1b2a27", mute:"#52635e", faint:"#84958f", line:"#e0e7df", soft:"#f2f6f3",
           teal:"#0d8f78", ok:"#0d8f78", bad:"#c9544b", warn:"#b7840b"};
const VLABEL = {ok:["정답", P.ok], part:["부분 정답", P.warn], bad:["오답", P.bad]};

function blk(css, html){ const d = document.createElement("div"); d.style.cssText = css; if(html != null) d.innerHTML = html; return d; }
function lbl(t){ return `<div style="font-size:9.5px; letter-spacing:.1em; color:${P.faint}; font-weight:600; margin-bottom:3px">${t}</div>`; }
function plain(h){ return String(h).replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, ""); }

function buildReportPages(name){
  const host = blk(`position:fixed; left:-20000px; top:0; width:${PW}px; z-index:-1`);
  document.body.appendChild(host);
  const nodes = [];
  let page;
  const newPage = () => {
    page = blk(`width:${PW}px; min-height:${PH}px; background:#fff; color:${P.ink}; box-sizing:border-box;
      padding:${PPAD}px; font-family:"Noto Sans KR","Malgun Gothic",sans-serif; font-size:12px; line-height:1.62;`);
    host.appendChild(page); nodes.push(page);
  };
  const add = node => {
    page.appendChild(node);
    if(page.scrollHeight > PH && page.childElementCount > 1){ page.removeChild(node); newPage(); page.appendChild(node); }
  };
  newPage();

  const pts = S.results.reduce((a,r) => a + (r.verdict === "ok" ? 1 : r.verdict === "part" ? .5 : 0), 0);
  const score = Math.round(pts);
  const today = new Date().toLocaleDateString("ko-KR", {year:"numeric", month:"long", day:"numeric"});

  add(blk(`border-bottom:2px solid ${P.ink}; padding-bottom:14px; margin-bottom:18px`, `
    <div style="font-size:10px; letter-spacing:.16em; color:${P.teal}; font-weight:600">친절한 재혁쌤 AI 튜터 · 학습 리포트</div>
    <div style="font-family:'Do Hyeon',sans-serif; font-size:25px; font-weight:700; margin-top:7px">${unitName(S.uid)}</div>
    <div style="display:flex; gap:26px; margin-top:12px; font-size:11.5px; color:${P.mute}">
      <span><b style="color:${P.ink}">학생</b>&nbsp; ${esc(name || "이름 미기재")}</span>
      <span><b style="color:${P.ink}">날짜</b>&nbsp; ${today}</span>
      <span><b style="color:${P.ink}">점수</b>&nbsp; <span style="font-family:'IBM Plex Mono',monospace; font-size:14px; color:${P.teal}; font-weight:600">${score} / ${S.results.length}</span></span>
    </div>`));

  const byC = {};
  S.results.forEach(r => { const c = r.q.concept; byC[c] = byC[c] || {n:0,p:0}; byC[c].n++; byC[c].p += (r.verdict==="ok"?1:r.verdict==="part"?.5:0); });
  add(blk(`margin-bottom:18px`, lbl("개념별 성취도") + `
    <table style="width:100%; border-collapse:collapse; font-size:11.5px">
      ${Object.entries(byC).map(([c,v]) => {
        const p = Math.round(v.p/v.n*100), col = p<50?P.bad:p<80?P.warn:P.ok;
        return `<tr>
          <td style="padding:5px 0; border-bottom:1px solid ${P.line}">${c}</td>
          <td style="padding:5px 0; border-bottom:1px solid ${P.line}; width:150px">
            <span style="display:inline-block; width:140px; height:6px; background:${P.soft}; border-radius:99px; overflow:hidden; vertical-align:middle">
              <span style="display:block; width:${p}%; height:6px; background:${col}"></span></span></td>
          <td style="padding:5px 0; border-bottom:1px solid ${P.line}; width:46px; text-align:right; font-family:'IBM Plex Mono',monospace; color:${P.mute}">${p}%</td>
        </tr>`; }).join("")}
    </table>`));

  add(blk(`font-family:'Do Hyeon',sans-serif; font-size:15px; font-weight:700; margin:6px 0 10px`, "문항별 피드백"));

  S.results.forEach((r,i) => {
    const q = r.q, v = VLABEL[r.verdict];
    let feed = "";
    if(q.type === "multi"){
      feed = `<div style="display:flex; flex-direction:column; gap:5px">` + q.items.map((it,j) => {
        const isAns = q.answer.includes(j), chosen = (r.pick||[]).includes(j);
        const col = isAns ? P.ok : P.faint;
        return `<div style="padding-left:15px; position:relative">
          <span style="position:absolute; left:0; color:${col}; font-weight:700">${isAns ? "✓" : "·"}</span>
          <b>${"ㄱㄴㄷㄹㅁ"[j]}</b>${chosen ? ` <span style="font-size:9.5px; color:${P.teal}">내가 고름</span>` : ""} — ${q.why[j]}</div>`;
      }).join("") + `</div>`;
    } else if(q.type === "essay"){
      feed = `<div style="display:flex; flex-direction:column; gap:4px">` + q.rubric.map((rb,j) =>
        `<div style="padding-left:15px; position:relative; color:${r.hits && r.hits[j] ? P.ink : P.mute}">
          <span style="position:absolute; left:0; color:${r.hits && r.hits[j] ? P.ok : P.faint}; font-weight:700">${r.hits && r.hits[j] ? "✓" : "·"}</span>${rb.label}</div>`).join("") + `</div>`;
    } else if(r.detail){
      feed = r.detail;
    }

    add(blk(`border:1px solid ${P.line}; border-left:3px solid ${v[1]}; border-radius:6px; padding:13px 15px; margin-bottom:9px; page-break-inside:avoid`, `
      <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:7px">
        <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:${P.faint}">${String(i+1).padStart(2,"0")}</span>
        <span style="font-size:9.5px; font-weight:600; color:${v[1]}; border:1px solid ${v[1]}; border-radius:3px; padding:1px 6px">${r.skipped ? "미응답" : v[0]}</span>
        <span style="font-size:9.5px; color:${P.faint}">${TYPE_LABEL[q.type]} · ${q.concept}</span>
      </div>
      <div style="font-weight:600; margin-bottom:9px; line-height:1.55">${q.q}</div>
      <div style="display:flex; gap:14px; margin-bottom:9px">
        <div style="flex:1; background:${P.soft}; border-radius:5px; padding:7px 10px">${lbl("내 답")}<div style="white-space:pre-wrap">${esc(r.mine || "(답하지 않음)")}</div></div>
        <div style="flex:1; background:${P.soft}; border-radius:5px; padding:7px 10px">${lbl("정답")}<div>${plain(answerText(q))}</div></div>
      </div>
      ${feed ? `<div style="margin-bottom:9px">${lbl("내 답에 대한 피드백")}<div style="color:${P.mute}">${feed}</div></div>` : ""}
      ${r.ai ? `<div style="border:1px dashed ${P.line}; border-radius:5px; padding:9px 11px; margin-bottom:9px">
        ${lbl("AI 선생님의 피드백")}
        <div style="color:${P.mute}"><b style="color:${P.ink}">잘한 점 ·</b> ${esc(r.ai.good)}</div>
        <div style="color:${P.mute}"><b style="color:${P.ink}">보완할 점 ·</b> ${esc(r.ai.improve)}</div>
        <div style="color:${P.mute}"><b style="color:${P.ink}">한 걸음 더 ·</b> ${esc(r.ai.next)}</div></div>` : ""}
      ${(r.asks||[]).length ? `<div style="border:1px dashed ${P.line}; border-radius:5px; padding:9px 11px; margin-bottom:9px">
        ${lbl("내가 한 질문")}${r.asks.map(a => `<div style="margin-bottom:5px"><div><b>Q.</b> ${esc(a.q)}</div><div style="color:${P.mute}"><b style="color:${P.ink}">A.</b> ${esc(a.a)}</div></div>`).join("")}</div>` : ""}
      <div>${lbl("개념 정교화")}<div style="color:${P.mute}">${q.explain}</div></div>`));
  });

  const weak = Object.entries(byC).filter(([,v]) => v.p/v.n < 0.6);
  if(weak.length){
    add(blk(`background:${P.soft}; border-radius:6px; padding:14px 16px; margin-top:8px`, `
      <div style="font-family:'Do Hyeon',sans-serif; font-size:14px; font-weight:700; margin-bottom:7px">다시 봐야 할 개념</div>
      <ul style="margin:0; padding-left:17px; color:${P.mute}">
        ${weak.map(([c]) => `<li style="margin-bottom:4px"><b style="color:${P.ink}">${c}</b> — ${plain(S.results.find(r => r.q.concept === c).q.explain)}</li>`).join("")}
      </ul>`));
  }
  add(blk(`margin-top:14px; padding-top:10px; border-top:1px solid ${P.line}; font-size:9.5px; color:${P.faint}; line-height:1.6`,
    "비상교육 중등 과학 3 Ⅵ. 에너지 전환과 보존 교과서와 수준별 1000제의 개념·유형을 바탕으로 출제했습니다. 중력가속도는 9.8을 사용합니다."));

  return {host, nodes};
}

async function exportPDF(){
  const btn = $("#pdfbtn"), old = btn.textContent;
  const name = ($("#sname") ? $("#sname").value.trim() : "");
  if(name){ const d = store(); d.name = name; save(d); }
  btn.disabled = true; btn.textContent = "리포트를 만드는 중…";
  let built = null;
  try{
    const dl = await getDownloads();
    if(!dl) throw {code:"unavailable"};
    built = buildReportPages(name);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:"mm", format:"a4"});
    const W = 210, HH = 297;
    for(let i = 0; i < built.nodes.length; i++){
      const c = await html2canvas(built.nodes[i], {scale:2, backgroundColor:"#ffffff", logging:false});
      const ratio = c.height / c.width;
      let w = W, h = W * ratio;
      if(h > HH){ h = HH; w = HH / ratio; }
      if(i) pdf.addPage();
      pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", (W-w)/2, 0, w, h);
    }
    built.host.remove(); built = null;
    const stamp = new Date().toISOString().slice(0,10).replace(/-/g,"");
    await dl.save({filename:`재혁쌤_학습리포트_${name ? name + "_" : ""}${stamp}.pdf`, data: pdf.output("blob")});
    btn.textContent = "저장했습니다 ✓";
  }catch(e){
    if(built) built.host.remove();
    btn.textContent = (e && e.code === "declined") ? "저장을 취소했습니다" : "저장하지 못했습니다";
  }
  setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2600);
}

/* ═══════════ 결과 리포트 ═══════════ */
function finish(){
  const pts = S.results.reduce((a,r) => a + (r.verdict === "ok" ? 1 : r.verdict === "part" ? 0.5 : 0), 0);
  const score = Math.round(pts);
  const d = store();
  d.runs++;
  if(S.uid !== "wrong" && (d.best[S.uid] == null || score > d.best[S.uid])) d.best[S.uid] = score;
  save(d);

  const byConcept = {};
  S.results.forEach(r => {
    const c = r.q.concept;
    byConcept[c] = byConcept[c] || {n:0, p:0};
    byConcept[c].n++;
    byConcept[c].p += (r.verdict === "ok" ? 1 : r.verdict === "part" ? 0.5 : 0);
  });
  const weak = Object.entries(byConcept).filter(([,v]) => v.p / v.n < 0.6).sort((a,b) => a[1].p/a[1].n - b[1].p/b[1].n);

  const who = d.name ? esc(d.name) + "님, " : "";
  const msg = score >= 9 ? who + "개념이 아주 탄탄해요. 종합 문제로 넘어가도 좋겠어요!"
            : score >= 7 ? who + "중요한 건 거의 다 잡았어요. 아래 개념만 채우면 완성입니다."
            : score >= 4 ? who + "절반쯤 왔어요. 아래 개념을 설명과 함께 다시 읽어 보면 금방 올라가요."
            : who + "지금은 어려울 수 있어요. 아래 개념부터 하나씩 보면 충분히 따라잡을 수 있어요.";

  H.report.innerHTML = `
    <div class="scorehead">
      <div class="scorebubble"><div><b>${score}</b><small>${S.qs.length}문제 중</small></div></div>
      <h1>${unitName(S.uid)}</h1>
      <p>${msg}</p>
    </div>

    <div class="savecard" id="savecard">
      <div class="savetext">
        <h3>오늘 받은 설명, 파일로 간직할까요?</h3>
        <p>이번에 푼 문제와 내 답, 그리고 받은 피드백이 전부 담긴 리포트를 PDF로 저장할 수 있어요.</p>
      </div>
      <div class="saveform" id="saveform">
        <input id="sname" class="answer-in" placeholder="이름 (선택)" value="${esc(store().name || "")}" maxlength="20">
        <button class="btn" id="pdfbtn">PDF로 저장</button>
      </div>
    </div>

    <div class="sec-h"><h2>개념별로 얼마나 알까?</h2><em>이번에 나온 개념만</em></div>
    <div class="bars">
      ${Object.entries(byConcept).map(([c,v]) => {
        const p = Math.round(v.p/v.n*100);
        return `<div class="barrow ${p<50?"low":p<80?"mid":""}"><span>${c}</span><span class="track"><i style="width:${p}%"></i></span><span class="pct">${p}%</span></div>`;
      }).join("")}
    </div>

    ${weak.length ? `
    <div class="sec-h"><h2>다음에 할 일</h2></div>
    <div class="nextup">
      <h3>이 개념만 다시 보면 돼요</h3>
      <ul>${weak.map(([c]) => {
        const src = S.results.find(r => r.q.concept === c);
        return `<li><b>${c}</b> — ${src.q.explain.replace(/<[^>]+>/g,"")}</li>`;
      }).join("")}</ul>
    </div>` : ""}

    <div class="sec-h"><h2>문제 다시 보기</h2><em>아직 ${S.results.filter(r=>r.verdict!=="ok").length}개 남았어요</em></div>
    <div class="review">
      ${S.results.map((r,i) => `
      <div class="rv ${r.verdict === "ok" ? "y" : r.verdict === "part" ? "p" : "n"}">
        <button class="rv-h" data-i="${i}">
          <span class="m">${r.verdict === "ok" ? "✓" : r.verdict === "part" ? "!" : "·"}</span>
          <span>${r.q.q}</span>
          <span class="ar">펼치기</span>
        </button>
        <div class="rv-b" hidden>
          <div><span class="lbl">내 답</span><div class="txt mine">${esc(r.mine || "(답하지 않음)")}</div></div>
          <div><span class="lbl">정답</span><div class="txt">${answerText(r.q)}</div></div>
          <div><span class="lbl">개념 정교화</span><div class="txt">${r.q.explain}</div></div>
        </div>
      </div>`).join("")}
    </div>

    <div class="center">
      <button class="btn" id="again">새 문제 10개 더 풀기</button>
      <button class="btn ghost" id="home">단원 고르러 가기</button>
    </div>`;

  H.report.querySelectorAll(".rv-h").forEach(b => b.onclick = () => {
    const body = b.nextElementSibling;
    body.hidden = !body.hidden;
    b.querySelector(".ar").textContent = body.hidden ? "펼치기" : "접기";
  });
  $("#pdfbtn").onclick = exportPDF;
  getDownloads().then(dl => {
    const f = $("#saveform");
    if(!dl && f) f.innerHTML = `<span style="font-size:14px; color:var(--ink-2); line-height:1.6">
      지금 보고 있는 화면에서는 파일 저장을 쓸 수 없어요.<br>선생님이 준 링크로 열면 저장 버튼이 나타납니다.</span>`;
  });
  $("#again").onclick = () => startQuiz(S.uid === "wrong" ? "wrong" : S.uid);
  $("#home").onclick = () => { renderHome(); show("home"); };
  show("report");
}

function answerText(q){
  if(q.type === "mc") return "①②③④⑤"[q.answer] + " " + q.choices[q.answer];
  if(q.type === "ox") return q.answer ? "옳다 (O)" : "옳지 않다 (X)";
  if(q.type === "multi") return q.answer.map(i => "ㄱㄴㄷㄹㅁ"[i]).join(", ");
  if(q.type === "calc") return `<b class="mono">${q.value} ${q.unit}</b> — ${q.solution}`;
  if(q.type === "short") return q.answers[0].replace(/\|/g," → ");
  return q.model;
}

/* ── 시작 ── */
$("#brand").onclick = () => { renderHome(); show("home"); };
renderHome();
show("home");
getSample();

</script>
